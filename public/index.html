<!-- ===== FLOATING CONTROLS PANEL (left side, like Cherry AI) ===== -->
<div id="floating-controls" style="
    position: fixed;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 9999;
    background: var(--bg-secondary);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 140px;
    max-width: 160px;
    font-size: 11px;
">
    <div style="display:flex;flex-direction:column;gap:4px;">
        <label style="font-size:8px;text-transform:uppercase;color:var(--text-dim);">Min.</label>
        <select id="floatingMineral" style="background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:4px;padding:3px 6px;font-size:11px;"></select>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
        <label style="font-size:8px;text-transform:uppercase;color:var(--text-dim);">Col.</label>
        <select id="floatingCollector" style="background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:4px;padding:3px 6px;font-size:11px;"></select>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
        <label style="font-size:8px;text-transform:uppercase;color:var(--text-dim);">Dep.</label>
        <select id="floatingDepressant" style="background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:4px;padding:3px 6px;font-size:11px;"></select>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
        <label style="font-size:8px;text-transform:uppercase;color:var(--text-dim);">Act.</label>
        <select id="floatingActivator" style="background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:4px;padding:3px 6px;font-size:11px;"></select>
        <div id="floatingActivatorHint" style="font-size:8px;color:var(--evidence-bright);padding:2px 4px;border-left:2px solid var(--evidence-bright);background:rgba(95,175,175,0.08);border-radius:2px;display:none;"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
        <label style="font-size:8px;text-transform:uppercase;color:var(--text-dim);">pH</label>
        <input type="range" id="floatingPH" min="1" max="14" step="0.1" value="7" style="width:100%;accent-color:var(--ochre-bright);" />
        <span id="floatingPHVal" style="font-size:10px;color:var(--ochre-bright);text-align:center;">7.0</span>
    </div>
</div>
