<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mineral Database – Flotation Sim</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0F172A;
      --bg-secondary: #1E293B;
      --bg-card: #273548;
      --bg-card-hover: #334155;
      --text-primary: #EDF2F7;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border-subtle: #334155;
      --color-aluminum: #D35400;
      --color-silicate: #D4A373;
      --color-ore: #8E4A49;
      --color-active: #D35400;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0 24px 48px;
    }

    .navbar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 0 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo span {
      color: var(--color-active);
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: 0.2s ease;
    }
    .nav-links a:hover {
      color: #fff;
    }
    .nav-links a.active {
      color: #fff;
      border-bottom-color: var(--color-active);
    }

    .container {
      max-width: 1280px;
      margin: 32px auto 0;
    }

    .page-header {
      margin-bottom: 36px;
    }
    .page-header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .page-header .subtitle {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 2px;
      letter-spacing: 0.2px;
    }
    .page-header .subtitle strong {
      color: #f1f5f9;
      font-weight: 500;
    }
    .page-header .description {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 1.05rem;
      max-width: 680px;
      line-height: 1.5;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 28px;
    }

    .category-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px 18px 18px;
      border-left: 6px solid var(--cat-color, #fff);
      box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 35px -10px rgba(0, 0, 0, 0.8);
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      color: #fff;
    }
    .category-header .cat-icon {
      font-size: 1.8rem;
    }

    .mineral-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mineral-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      transition: background 0.2s ease;
      cursor: default;
    }
    .mineral-item:hover {
      background: var(--bg-card-hover);
    }

    .mineral-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mineral-icon {
      font-size: 1.8rem;
      width: 36px;
      text-align: center;
      transition: transform 0.25s ease;
    }
    .mineral-item:hover .mineral-icon {
      transform: scale(1.15) rotate(-4deg);
    }
    .mineral-name {
      font-weight: 500;
      font-size: 1.05rem;
      color: #f1f5f9;
    }

    .btn-more {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
    }
    .btn-more:hover {
      background: var(--color-active);
      border-color: var(--color-active);
      color: #fff;
    }

    /* ----- MODAL ----- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 16, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 0.25s ease;
    }
    .modal-overlay.open {
      display: flex;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-box {
      background: var(--bg-secondary);
      max-width: 820px;
      width: 100%;
      max-height: 92vh;
      border-radius: 24px;
      padding: 32px 34px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      overflow-y: auto;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.8rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .modal-close:hover {
      color: #fff;
      transform: rotate(90deg);
    }

    .modal-mineral-name {
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 4px;
    }
    .modal-mineral-name .big-icon {
      font-size: 2.6rem;
    }
    .modal-formula {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 20px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: #0F172A;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.82rem;
      padding: 10px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s ease;
      font-family: 'Inter', sans-serif;
      min-width: 100px;
    }
    .tab-btn.active {
      background: var(--color-active);
      color: #fff;
      box-shadow: 0 4px 12px rgba(211, 84, 0, 0.3);
    }
    .tab-btn:hover:not(.active) {
      color: #fff;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .tab-content.active {
      display: block;
    }

    /* Data grids */
    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 24px;
    }
    .data-item {
      display: flex;
      flex-direction: column;
    }
    .data-item .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .data-item .value {
      font-size: 1rem;
      font-weight: 500;
      color: #f1f5f9;
      margin-top: 2px;
    }

    .industrial-text {
      background: rgba(211, 84, 0, 0.08);
      border-left: 3px solid var(--color-active);
      padding: 14px 18px;
      border-radius: 8px;
      margin-top: 16px;
      color: #d4dce8;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .industrial-text strong {
      color: #fff;
    }

    /* Crystal Structure Tab */
    .crystal-header {
      margin-bottom: 16px;
    }
    .crystal-header .system-name {
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
    }
    .crystal-header .cleavage-info {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 2px;
    }
    #crystal-container {
      width: 100%;
      height: 380px;
      border-radius: 16px;
      background: #0A0F1A;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      position: relative;
    }
    #crystal-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .crystal-hint {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-align: center;
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    @media (max-width: 600px) {
      .data-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .nav-links {
        gap: 16px;
        flex-wrap: wrap;
      }
      .modal-box {
        padding: 24px 16px;
      }
      .page-header h1 {
        font-size: 1.6rem;
        flex-wrap: wrap;
      }
      .category-grid {
        grid-template-columns: 1fr;
      }
      #crystal-container {
        height: 260px;
      }
      .tab-btn {
        font-size: 0.7rem;
        min-width: 70px;
        padding: 8px 0;
      }
    }

    .modal-box::-webkit-scrollbar {
      width: 5px;
    }
    .modal-box::-webkit-scrollbar-track {
      background: transparent;
    }
    .modal-box::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 8px;
    }
  </style>
</head>

    </div>
  </div>

    // ============================================================
    // RENDER CATEGORIES
    // ============================================================
    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = '';

      const groups = {};
      minerals.forEach(m => {
        if (!groups[m.category]) groups[m.category] = [];
        groups[m.category].push(m);
      });

      for (const [catName, items] of Object.entries(groups)) {
        const color = items[0].categoryColor;
        const icon = items[0].catIcon;

        const card = document.createElement('div');
        card.className = 'category-card';
        card.style.setProperty('--cat-color', color);

        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `<span class="cat-icon">${icon}</span> ${catName}`;
        card.appendChild(header);

        const list = document.createElement('div');
        list.className = 'mineral-list';

        items.forEach(mineral => {
          const item = document.createElement('div');
          item.className = 'mineral-item';

          const left = document.createElement('div');
          left.className = 'mineral-left';
          left.innerHTML = `
            <span class="mineral-icon">${mineral.icon}</span>
            <span class="mineral-name">${mineral.name}</span>
          `;

          const btn = document.createElement('button');
          btn.className = 'btn-more';
          btn.textContent = 'More Info';
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openModal(mineral.id);
          });

          item.appendChild(left);
          item.appendChild(btn);
          list.appendChild(item);
        });

        card.appendChild(list);
        grid.appendChild(card);
      }
    }

    // ============================================================
    // MODAL LOGIC (DOM updates)
    // ============================================================
    let currentMineralId = null;

    function openModal(id) {
      const mineral = minerals.find(m => m.id === id);
      if (!mineral) return;
      currentMineralId = id;

      // Header
      document.getElementById('modalIcon').textContent = mineral.icon;
      document.getElementById('modalName').textContent = mineral.name;
      document.getElementById('modalFormula').textContent = `Formula: ${mineral.formula}`;

      // ---- Physical tab ----
      const physGrid = document.getElementById('physicalGrid');
      physGrid.innerHTML = `
        <div class="data-item"><span class="label">Formula</span><span class="value">${mineral.formula}</span></div>
        <div class="data-item"><span class="label">Density</span><span class="value">${mineral.density}</span></div>
        <div class="data-item"><span class="label">Mohs Hardness</span><span class="value">${mineral.mohs}</span></div>
        <div class="data-item"><span class="label">Point of Zero Charge (PZC)</span><span class="value">${mineral.pzc}</span></div>
        <div class="data-item"><span class="label">HSAB Classification</span><span class="value">${mineral.hsab}</span></div>
        <div class="data-item"><span class="label">Habit / Morphology</span><span class="value">${mineral.habit}</span></div>
      `;

      // ---- Process tab ----
      const procGrid = document.getElementById('processGrid');
      procGrid.innerHTML = `
        <div class="data-item"><span class="label">Typical Collectors</span><span class="value">${mineral.collectors}</span></div>
        <div class="data-item"><span class="label">Adsorption Mechanism</span><span class="value">${mineral.mechanism}</span></div>
      `;
      document.getElementById('industrialText').textContent = mineral.industrial;

      // ---- Crystal tab (header) ----
      document.getElementById('crystalSystemName').textContent = `${mineral.crystalSystem} System`;
      document.getElementById('crystalCleavageInfo').textContent = `Cleavage: ${mineral.cleavage}`;

      // ---- Reset tabs to Physical ----
      switchTab('physical');

      // ---- Show modal ----
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';

      // ---- Initialize 3D viewer after a tiny delay (DOM renders) ----
      setTimeout(() => {
        initCrystalViewer(mineral);
      }, 100);
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
      disposeCrystalViewer();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabId);
      });
      document.getElementById('tabPhysical').classList.toggle('active', tabId === 'physical');
      document.getElementById('tabProcess').classList.toggle('active', tabId === 'process');
      document.getElementById('tabCrystal').classList.toggle('active', tabId === 'crystal');

      // If switching to crystal, ensure viewer is sized correctly
      if (tabId === 'crystal' && currentMineralId) {
        const mineral = minerals.find(m => m.id === currentMineralId);
        if (mineral) {
          setTimeout(() => {
            initCrystalViewer(mineral);
          }, 50);
        }
      }
    }

    // ============================================================
    // 3D CRYSTAL VIEWER (Three.js)
    // ============================================================
    let renderer, scene, camera, controls, animationId;
    let currentViewerMineralId = null;

    function getGeometryForSystem(system) {
      const group = new THREE.Group();

      // Base material: translucent with wireframe overlay
      const solidMat = new THREE.MeshPhongMaterial({
        color: 0xD35400,
        transparent: true,
        opacity: 0.35,
        shininess: 30,
        side: THREE.DoubleSide,
      });
      const wireMat = new THREE.LineBasicMaterial({
        color: 0xFF9944,
        linewidth: 1,
      });

      let mesh, wireframe, geo;

      switch (system) {
        case 'Cubic':
          geo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
          mesh = new THREE.Mesh(geo, solidMat);
          wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(geo), wireMat);
          group.add(mesh);
          group.add(wireframe);
          break;

        case 'Tetragonal':
          geo = new THREE.BoxGeometry(1.4, 2.0, 1.4);
          mesh = new THREE.Mesh(geo, solidMat);
          wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(geo), wireMat);
          group.add(mesh);
          group.add(wireframe);
          break;

        case 'Orthorhombic':
          geo = new THREE.BoxGeometry(1.8, 2.2, 1.0);
          mesh = new THREE.Mesh(geo, solidMat);
          wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(geo), wireMat);
          group.add(mesh);
          group.add(wireframe);
          break;

        case 'Monoclinic': {
          // Shear along Y to tilt it
          geo = new THREE.BoxGeometry(1.6, 2.0, 1.2);
          mesh = new THREE.Mesh(geo, solidMat);
          mesh.position.x = 0.2;
          mesh.rotation.z = 0.15;
          mesh.rotation.x = 0.1;
          const edges = new THREE.EdgesGeometry(geo);
          wireframe = new THREE.LineSegments(edges, wireMat);
          wireframe.position.copy(mesh.position);
          wireframe.rotation.copy(mesh.rotation);
          group.add(mesh);
          group.add(wireframe);
          break;
        }

        case 'Triclinic': {
          geo = new THREE.BoxGeometry(1.6, 1.8, 1.2);
          mesh = new THREE.Mesh(geo, solidMat);
          mesh.position.set(0.3, 0.1, 0.2);
          mesh.rotation.set(0.2, 0.3, 0.1);
          const edges = new THREE.EdgesGeometry(geo);
          wireframe = new THREE.LineSegments(edges, wireMat);
          wireframe.position.copy(mesh.position);
          wireframe.rotation.copy(mesh.rotation);
          group.add(mesh);
          group.add(wireframe);
          break;
        }

        case 'Trigonal': {
          // Hexagonal prism + pyramid top
          const prismGeo = new THREE.CylinderGeometry(1.2, 1.2, 1.6, 6);
          const prismMesh = new THREE.Mesh(prismGeo, solidMat);
          const prismWire = new THREE.LineSegments(new THREE.EdgesGeometry(prismGeo), wireMat);
          group.add(prismMesh);
          group.add(prismWire);

          const pyramidGeo = new THREE.ConeGeometry(1.2, 0.8, 6);
          const pyramidMesh = new THREE.Mesh(pyramidGeo, solidMat);
          pyramidMesh.position.y = 1.2;
          const pyramidWire = new THREE.LineSegments(new THREE.EdgesGeometry(pyramidGeo), wireMat);
          pyramidWire.position.y = 1.2;
          group.add(pyramidMesh);
          group.add(pyramidWire);

          // bottom pyramid
          const pyramidBot = new THREE.ConeGeometry(1.2, 0.8, 6);
          const pyramidMeshBot = new THREE.Mesh(pyramidBot, solidMat);
          pyramidMeshBot.position.y = -1.2;
          pyramidMeshBot.rotation.x = Math.PI;
          const pyramidWireBot = new THREE.LineSegments(new THREE.EdgesGeometry(pyramidBot), wireMat);
          pyramidWireBot.position.y = -1.2;
          pyramidWireBot.rotation.x = Math.PI;
          group.add(pyramidMeshBot);
          group.add(pyramidWireBot);
          break;
        }

        default: {
          // fallback: simple box
          geo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
          mesh = new THREE.Mesh(geo, solidMat);
          wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(geo), wireMat);
          group.add(mesh);
          group.add(wireframe);
        }
      }

      // Add axes helper (small)
      const axes = new THREE.AxesHelper(2.2);
      group.add(axes);

      return group;
    }

    function initCrystalViewer(mineral) {
      const container = document.getElementById('crystal-container');
      if (!container) return;

      // If already viewing the same mineral, just resize
      if (currentViewerMineralId === mineral.id && renderer) {
        const rect = container.getBoundingClientRect();
        const w = rect.width || container.clientWidth || 600;
        const h = rect.height || container.clientHeight || 380;
        renderer.setSize(w, h);
        return;
      }

      // Dispose old viewer
      disposeCrystalViewer();

      const rect = container.getBoundingClientRect();
      const width = rect.width || container.clientWidth || 600;
      const height = rect.height || container.clientHeight || 380;

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0A0F1A);

      // Camera
      camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 20);
      camera.position.set(3.5, 2.5, 4.5);
      camera.lookAt(0, 0, 0);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Controls with auto-rotate
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 2.5;
      controls.minDistance = 2.5;
      controls.maxDistance = 10;
      controls.target.set(0, 0, 0);

      // Lights
      const ambLight = new THREE.AmbientLight(0x404060);
      scene.add(ambLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
      dirLight.position.set(2, 5, 3);
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0xffaa66, 0.6);
      fillLight.position.set(-3, 1, -2);
      scene.add(fillLight);

      // Add the crystal model
      const modelGroup = getGeometryForSystem(mineral.crystalSystem);
      scene.add(modelGroup);

      // Store reference
      currentViewerMineralId = mineral.id;

      // Start loop
      animate();
    }

    function animate() {
      animationId = requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function disposeCrystalViewer() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      if (renderer) {
        const container = document.getElementById('crystal-container');
        if (container && renderer.domElement && renderer.domElement.parentNode === container) {
          container.removeChild(renderer.domElement);
        }
        renderer.dispose();
        renderer = null;
      }
      // Remove references for garbage collection
      scene = null;
      camera = null;
      controls = null;
      currentViewerMineralId = null;
    }

    // ============================================================
    // EVENT LISTENERS & BOOT
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        switchTab(btn.dataset.tab);
      });
    });

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Handle window resize for the 3D viewer
    window.addEventListener('resize', () => {
      if (renderer && currentViewerMineralId) {
        const container = document.getElementById('crystal-container');
        if (container) {
          const rect = container.getBoundingClientRect();
          const w = rect.width || container.clientWidth || 600;
          const h = rect.height || container.clientHeight || 380;
          renderer.setSize(w, h);
          if (camera) {
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
          }
        }
      }
    });

    // Boot the page
    renderCategories();

    // If modal is closed while 3D is running, dispose it (already handled in closeModal)
    console.log('🫧 Mineral Database loaded with 3D Crystal Viewer!');
  </script>
</body>
</html>
